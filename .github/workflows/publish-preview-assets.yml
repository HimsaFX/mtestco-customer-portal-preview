name: Publish AVA customer portal preview assets

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-preview-assets.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout preview repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified portal build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets

          BASE='https://zwgnrlvxvthdsdkeuimn.supabase.co/functions/v1/customer-portal-preview/'
          CSS='index-CjAsrjZn.css'
          JS='index-DmEQaWKr.js'

          curl --fail-with-body --silent --show-error \
            "${BASE}assets/${CSS}" \
            --output "assets/${CSS}"

          curl --fail-with-body --silent --show-error \
            "${BASE}assets/${JS}" \
            --output "assets/${JS}"

          test "$(stat -c%s "assets/${CSS}")" -gt 100000
          test "$(stat -c%s "assets/${JS}")" -gt 500000
          grep -q 'zwgnrlvxvthdsdkeuimn.supabase.co' "assets/${JS}"

          cat > index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <meta name="theme-color" content="#061426" />
              <meta
                name="description"
                content="AVA customer equipment intelligence portal for certifications, assets, reports, repairs, and chain of custody."
              />
              <title>AVA Equipment Intelligence</title>
              <script type="module" crossorigin src="./assets/index-DmEQaWKr.js"></script>
              <link rel="stylesheet" crossorigin href="./assets/index-CjAsrjZn.css" />
            </head>
            <body>
              <div id="root"></div>
            </body>
          </html>
          HTML

          cp index.html 404.html
          touch .nojekyll

          cat > README.md <<'MD'
          # AVA Customer Portal Preview

          Public compiled preview of the AVA Equipment Intelligence customer portal.

          This repository contains only browser-ready static assets for product review. The source application, database migrations, production credentials, and customer data remain in private systems.
          MD

      - name: Commit published preview
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git rm .github/workflows/publish-preview-assets.yml
          git add index.html 404.html .nojekyll README.md assets/
          git diff --cached --check
          git commit -m 'Publish verified AVA customer portal preview'
          git push origin HEAD:main
